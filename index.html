<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contour Dots — depth-driven dot renderer</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><circle cx='16' cy='16' r='7' fill='%23ff2233'/></svg>">
</head>
<body>

<aside id="panel">
  <header class="brand">
    <h1>Contour Dots</h1>
  </header>

  <div class="io">
    <button id="loadImage" class="primary">Load image</button>
    <button id="reset">Reset</button>
  </div>

  <div id="controls"></div>

  <footer class="foot">
    <button id="download" class="primary">Download</button>
    <p>A folder holding the SVG and the settings that made it.</p>
  </footer>
</aside>

<main id="stage">
  <button id="panelToggle" title="Show / hide controls" aria-label="Show or hide controls">&#9776;</button>
  <div id="canvasHolder"></div>
  <div class="bar">
    <span id="stats"></span>
    <span id="status"></span>
  </div>
</main>

<input type="file" id="imageInput" accept="image/*" hidden>
<input type="file" id="shapeInput" accept=".svg,image/svg+xml" hidden>

<!-- p5.js is vendored so the tool runs offline and straight off the filesystem.
     If the local copy is missing, fall back to the CDN. -->
<script src="vendor/p5.min.js"></script>
<script>
  if (!window.p5) {
    document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"><\/script>');
  }
</script>
<script src="js/core.js"></script>
<script src="js/field.js"></script>
<script src="js/streamlines.js"></script>
<script src="js/isolines.js"></script>
<script src="js/edge.js"></script>
<script src="js/fingerprint.js"></script>
<script src="js/shapes.js"></script>
<script src="js/dots.js"></script>
<script src="js/svgexport.js"></script>
<script src="js/zip.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
